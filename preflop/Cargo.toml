[package]
name = "gtotutor-preflop"
version = "0.1.0"
edition = "2021"
publish = false
# Our own code only: this crate must not depend on postflop-solver (AGPL), so its output and
# the binary itself can be used anywhere.

[dependencies]
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
