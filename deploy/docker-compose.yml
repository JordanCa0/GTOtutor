# Runs on the EC2 instance from /opt/gtotutor (see docs/deployment.md).
# API_IMAGE and API_DOMAIN come from deploy.env (linked as .env, which Compose reads on its own);
# app secrets from app.env (written from SSM by deploy.sh).
services:
  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file: app.env
    volumes:
      - /data/solver-output:/data/solver-output:ro
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION}
        awslogs-group: /gtotutor/api
        awslogs-create-group: "true"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  caddy_data:
